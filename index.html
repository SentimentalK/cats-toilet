<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bcd8ea">
<title>俺家的猫厕所 Cat's Toilet</title>
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="猫厕所">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/social.css">
<script>
  // Installable + offline support, only when served over http(s). Opened
  // straight from disk (file://) both are skipped silently: Chrome refuses to
  // fetch a manifest from file:// and logs an error, so the manifest link is
  // added here instead of as static markup.
  (function () {
    try {
      if (!/^https?:$/.test(location.protocol)) return;
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.appendChild(link);
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('[pwa] service worker registration failed:', err);
        });
      });
    } catch (_) { /* no service worker support: play online only */ }
  })();
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-paw" viewBox="0 0 24 24">
    <ellipse cx="12" cy="16.2" rx="5.4" ry="4.5"/>
    <ellipse cx="4.9" cy="10.6" rx="2.2" ry="2.9" transform="rotate(-18 4.9 10.6)"/>
    <ellipse cx="9.4" cy="6" rx="2.2" ry="3"/>
    <ellipse cx="14.6" cy="6" rx="2.2" ry="3"/>
    <ellipse cx="19.1" cy="10.6" rx="2.2" ry="2.9" transform="rotate(18 19.1 10.6)"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24">
    <path fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7L10.3 2Zm1.7 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/>
  </symbol>
  <symbol id="i-shop" viewBox="0 0 24 24">
    <path fill-rule="evenodd" d="M8.2 3.6a1.1 1.1 0 0 1 1.9 1.1L8 8.4h8l-2.1-3.7a1.1 1.1 0 0 1 1.9-1.1l2.7 4.8H21a1 1 0 0 1 1 1.2l-1.6 8.6a2.2 2.2 0 0 1-2.2 1.8H5.8a2.2 2.2 0 0 1-2.2-1.8L2 9.6a1 1 0 0 1 1-1.2h2.5l2.7-4.8ZM8 11.5V17h1.6v-5.5H8Zm3.2 0V17h1.6v-5.5h-1.6Zm3.2 0V17H16v-5.5h-1.6Z"/>
  </symbol>
  <symbol id="i-plaza" viewBox="0 0 24 24">
    <path d="M12 2.2c3.3 0 5.6 2.4 5.6 5.2 0 .5-.1 1-.2 1.4 1.7.7 2.9 2.3 2.9 4.2 0 2.6-2.2 4.6-4.9 4.6h-2.1V22h-2.6v-4.4H8.6c-2.7 0-4.9-2-4.9-4.6 0-1.9 1.2-3.5 2.9-4.2-.1-.4-.2-.9-.2-1.4 0-2.8 2.3-5.2 5.6-5.2Z"/>
  </symbol>
</svg>

<div id="app">
  <main id="stage">
    <div id="room">
    <div id="scene">
      <img id="bg" src="assets/room-bg.jpg" alt="" draggable="false">

      <div class="sprite" id="bag"><img src="assets/bag.png" alt="垃圾袋" draggable="false"></div>

      <div class="sprite" id="box"><img alt="猫砂盆" draggable="false"></div>
      <div id="poops"></div>
      <div class="sprite" id="cat"><img alt="猫咪" draggable="false"></div>
      <div class="sprite" id="rim" aria-hidden="true"><img alt="" draggable="false"></div>

      <div id="stink" aria-hidden="true">
        <svg viewBox="0 0 120 100">
          <path class="cloud" d="M30 78c-13 0-22-9-22-20 0-9 6-17 15-19 1-14 12-25 27-25 11 0 20 6 24 15 3-1 5-2 8-2 12 0 21 9 21 20 0 4-1 7-3 10 5 3 8 8 8 14 0 9-8 16-17 16-5 0-9-2-12-5-4 4-9 6-15 6-7 0-13-3-17-8-4 3-10 5-17-2Z"/>
          <path class="face" d="M44 52q5 4 10 0M68 52q5 4 10 0" fill="none" stroke-width="2.6" stroke-linecap="round"/>
          <ellipse class="blush" cx="40" cy="60" rx="5" ry="3"/><ellipse class="blush" cx="82" cy="60" rx="5" ry="3"/>
        </svg>
      </div>

      <div class="sprite" id="scoop"><img src="assets/scoop.png" alt="猫砂铲" draggable="false"></div>

      <div id="bubble" hidden></div>
      <div id="fx"></div>
    </div>
    </div>

    <header id="hud">
      <div id="logo">
        <span class="ears" aria-hidden="true"></span>
        <strong>俺家的猫厕所</strong>
        <em>Cat's Toilet <svg><use href="#i-paw"/></svg></em>
      </div>
      <div class="hud-right">
        <div id="points" title="积分">
          <span class="coin"><svg><use href="#i-paw"/></svg></span>
          <b id="points-num">0</b>
        </div>
        <button id="btn-settings" class="round-btn" aria-label="设置"><svg><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <div id="toast" hidden></div>
  </main>

  <section id="panel">
    <div id="status" class="card" role="button" tabindex="0" aria-label="猫砂盆，点开升级">
      <img id="status-thumb" alt="" draggable="false">
      <div class="status-main">
        <div class="status-title"><span id="lv-badge">Lv.0</span><span id="box-name">塑料小盆</span></div>
        <div class="status-row"><div id="pips" aria-label="猫砂盆里的便便"></div><span id="up-chip" hidden>可升级 ↑</span><span id="buff" hidden></span></div>
      </div>
      <div class="status-timer">
        <small id="timer-label">本次蹲坑</small>
        <b id="timer">00:00</b>
      </div>
    </div>

    <div id="stats" class="card">
      <div><small>累计蹲坑</small><b id="stat-time">0 分钟</b></div>
      <div><small>累计铲屎</small><b id="stat-scooped">0 坨</b></div>
      <div><small>每坨积分</small><b id="stat-value">10</b></div>
    </div>

    <nav id="tabs">
      <button id="tab-squat" class="tab"><img alt="" draggable="false"><span>蹲坑</span></button>
      <button id="tab-scoop" class="tab"><img src="assets/scoop.png" alt="" draggable="false"><span>铲屎</span><i id="scoop-badge" hidden>0</i></button>
      <button id="tab-shop" class="tab"><svg><use href="#i-shop"/></svg><span>商店</span><i id="shop-dot" class="dot" hidden></i></button>
      <button id="tab-plaza" class="tab"><svg><use href="#i-plaza"/></svg><span>广场</span></button>
    </nav>
  </section>

  <div id="sheet-wrap" hidden>
    <div id="sheet" class="card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button id="sheet-close" class="round-btn" aria-label="关闭">✕</button>
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
    </div>
  </div>
</div>

<div id="social"></div>

<script src="js/cats.js"></script>
<script src="js/game.js"></script>
<script src="js/api.js"></script>
<script src="js/account.js"></script>
<script src="js/plaza.js"></script>
</body>
</html>
